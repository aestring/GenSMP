# GenSMP Configuration File
# Version: 1.0.0

# Ability Settings
abilities:
  # Cooldown in seconds for Gen abilities
  cooldown: 30

# DNA Combination Settings
dna:
  # Cooldown in seconds for DNA combination abilities
  cooldown: 90

# Gen Settings
gens:
  # Time in milliseconds before a newly obtained Gen unlocks
  unlock_time: 600000  # 10 minutes

# Player Data
player-data:
  # Auto-save interval in minutes
  auto-save-interval: 5

